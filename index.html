<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hanging Bulb with Pull Cord</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
            background-color: #0d1117;
            transition: background 0.5s ease;
        }

        /* دۆخی ژوورەکە کاتێک گلۆپ دەکوژێتەوە (تاریک) */
        body.dark-room {
            background-color: #030507;
        }

        /* بەشی سەرەوەی بنکەی گلۆپ */
        .ceiling-wire {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 150px;
            background: #222;
        }

        /* گلۆپەکە */
        .bulb-container {
            position: absolute;
            top: 150px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        /* سەری سەرەوەی گلۆپ */
        .bulb-cap {
            width: 30px;
            height: 20px;
            background: #444;
            border-radius: 4px 4px 0 0;
        }

        /* شوشەی گلۆپ */
        .bulb-glass {
            width: 80px;
            height: 80px;
            background: #333;
            border-radius: 50%;
            position: relative;
            box-shadow: inset 0 -10px 15px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        /* کاتێک گلۆپەکە هەڵدەبێت (پێبێت) */
        body:not(.dark-room) .bulb-glass {
            background: #fff3cd;
            box-shadow: 0 0 60px 20px rgba(255, 230, 100, 0.8), inset 0 -5px 10px rgba(255,200,0,0.5);
        }

        /* داوەکەی (پەتەکەی) خوارەوەی گلۆپ بۆ کوژاندنەوە و هەڵکردن */
        .pull-cord {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 50px;
            background: #888;
            cursor: pointer;
            transition: height 0.1s ease;
        }

        /* تۆپەچکەی کۆتایی پەتەکە */
        .pull-cord::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: -4px;
            width: 10px;
            height: 10px;
            background: #ccc;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .pull-cord:hover {
            height: 65px; /* کاتێک ماوسی دەچێتە سەری کەمێک ڕادەکێشڕێت */
        }

        /* ڕێنمایی لە سەرەوە */
        .instruction {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            pointer-events: none;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body class="dark-room">

    <div class="instruction">Click on the hanging cord to Turn ON / OFF the light</div>

    <!-- وایەری سەرەوە -->
    <div class="ceiling-wire"></div>

    <!-- گلۆپ و پەتەکە -->
    <div class="bulb-container">
        <div class="bulb-cap"></div>
        <div class="bulb-glass">
            <!-- داوەکە لێرەدایە بۆ کلیک کردن -->
            <div class="pull-cord" onclick="toggleLight()" title="Click to pull cord"></div>
        </div>
    </div>

    <script>
        function toggleLight() {
            const body = document.body;
            // گۆڕینی دۆخی ژوورەکە لە نێوان تاریک و ڕووناک
            body.classList.toggle('dark-room');
        }
    </script>

</body>
</html>
